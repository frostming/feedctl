name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PDM and Python
        uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0 # v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: true
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pdm install --frozen-lockfile

      - name: Smoke test the CLI
        run: pdm run feedctl --help

      - name: Run tests
        run: pdm run python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: pdm run python -m compileall -q src tests

      - name: Build distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: pdm build
